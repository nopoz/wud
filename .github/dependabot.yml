# Dependabot configuration.
#
# npm: security updates only (open-pull-requests-limit: 0 turns version
# updates off), grouped into one PR per directory. Requires "Dependabot
# security updates" to be enabled in the repo's code security settings.
#
# github-actions: keep version updates (monthly, grouped). Action releases are
# infrequent and refreshing the SHA pins has a real security payoff for low
# noise. Dependabot bumps both the SHA and the # vX.Y.Z comment.
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /app
      - /ui
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
