name: Nightly scan

# Scheduled deep scans that don't fit the per-PR gates: a full-history secret
# sweep (the PR gitleaks job only sees the diff), and a rescan of the published
# image. The rescan is the only thing that catches a CVE disclosed *after* a
# release, since the PR and publish scans both look at build time only.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  gitleaks-full:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history so the sweep covers every commit, not just the tip.
          fetch-depth: 0
      - name: Scan entire history for secrets
        # Non-PR events make gitleaks run a full `detect`. Known fake
        # example/test secrets are suppressed via .gitleaksignore, so a clean
        # run means a genuine new leak would fail this job.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-rescan:
    name: Trivy rescan (published image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload Trivy SARIF to code scanning
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: block
          # Trivy install (get.trivy.dev on a cold cache, check.trivy.dev for
          # the version probe) plus ghcr for both the DB and the image pull.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            check.trivy.dev:443
            get.trivy.dev:443
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:latest
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938  # v4.37.9
        with:
          sarif_file: trivy-results.sarif
          # Distinct from trivy-image (PR) and trivy-release (publish) so the
          # three scans do not overwrite each other's code-scanning results.
          category: trivy-nightly
